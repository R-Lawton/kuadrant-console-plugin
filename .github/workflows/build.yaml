name: Build Check

on:
  pull_request:
    branches:
      - '**'
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: build-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check for source changes
        id: changes
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${PR_NUMBER}/files" --paginate --jq '.[].filename')
          if echo "$FILES" | grep -qvE '(\.md$|^docs/|^\.github/|^LICENSE$|^charts/|^config/|^kuadrant-dev-setup/|^\.devcontainer/)'; then
            echo "src=true" >> "$GITHUB_OUTPUT"
          else
            echo "src=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: github.event_name != 'pull_request' || steps.changes.outputs.src == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: github.event_name != 'pull_request' || steps.changes.outputs.src == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack
        if: github.event_name != 'pull_request' || steps.changes.outputs.src == 'true'
        run: corepack enable

      - name: Install dependencies
        if: github.event_name != 'pull_request' || steps.changes.outputs.src == 'true'
        run: yarn install

      - name: Run production build
        if: github.event_name != 'pull_request' || steps.changes.outputs.src == 'true'
        run: yarn build
